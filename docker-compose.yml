services:
  steam-idler:
    image: ghcr.io/zhu0823/steam-idler:latest
    # 不使用 GHCR 镜像、改为本地构建时取消注释
    # build: .
    container_name: steam-idler
    restart: unless-stopped
    # data 目录需对该 UID 可写，NAS 上可改成自己的 PUID/PGID
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # 默认只在本机监听，通过反向代理（HTTPS）或 SSH 隧道访问；
      # NAS 上需要局域网直接访问时，在 .env 中设置 WEB_BIND=0.0.0.0
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8600}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
